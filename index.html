<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Sonder">
        <link rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="style.css">
        <title>Sonder</title>
    </head>
    <body>
        <header>
            <h1>Sonder</h1>
        </header>

        <section>
            <div id="poem">
                <p>The lives of those who pass by</p>

                <p>Parallel and never intersecting save for this one moment</p>

                <p>A glance</p>

                <p>Now you are a ripple</p>
            </div>
        </section>
    </body>
</html>
